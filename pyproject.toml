[project]
name = "roleplay-chatbot"
version = "1.1.0"
description = "Local AI-powered roleplay chatbot using Ollama and LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.125.0",
    "httpx",
    "langchain-core>=1.2.28",
    "langchain-google-genai>=4.2.1",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.1.6",
    "langgraph-checkpoint-mongodb>=0.3.1",
    "pydantic>=2.12.5",
    "pymongo>=4.15.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.17.1",
    "uvicorn>=0.38.0",
]

[project.scripts]
cli = "main:main"
api = "app.api.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]
