[project]
name = "roleplay-chatbot"
version = "1.1.0"
description = "Local AI-powered roleplay chatbot using Ollama and LangGraph"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "langchain-core",
    "langchain-google-genai",
    "langchain-ollama",
    "langgraph",
    "langgraph-checkpoint-mongodb",
    "pydantic",
    "pymongo",
    "python-dotenv",
    "pyyaml",
    "qdrant-client",
    "uvicorn",
]

[project.scripts]
cli = "main:main"
api = "app.api.__main__:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]
